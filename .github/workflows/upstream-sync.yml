name: Sync and test upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]
permissions: {}
jobs:
  upstream:
    permissions:
      id-token: write
      contents: write
      actions: write
      checks: read
      statuses: write
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@02d38fe80b2fecb41503a90943fd04000174b955
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: 02d38fe80b2fecb41503a90943fd04000174b955
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.ATTIC_PUSH_ENABLED == 'true' }}
      cache: ${{ vars.ATTIC_PUSH_ENABLED == 'true' }}
      attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      attic-cache: ${{ vars.ATTIC_CACHE }}
      attic-substituter: ${{ vars.ATTIC_SUBSTITUTER }}
      attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY }}
    secrets:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
